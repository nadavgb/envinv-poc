name: cachetest
on:
  push:
jobs:
  c:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: branch writes a poisoned cache
        if: github.ref != 'refs/heads/main'
        run: mkdir -p payload && echo "POISON-FROM-${GITHUB_REF_NAME}" > payload/marker.txt
      - uses: actions/cache/save@v4
        if: github.ref != 'refs/heads/main'
        with: { path: payload, key: poison-key-v1 }
      - name: main tries to restore the branch cache
        if: github.ref == 'refs/heads/main'
        run: mkdir -p payload
      - uses: actions/cache/restore@v4
        id: r
        if: github.ref == 'refs/heads/main'
        with: { path: payload, key: poison-key-v1 }
      - name: report
        if: github.ref == 'refs/heads/main'
        run: |
          echo "CACHEHIT<<<${{ steps.r.outputs.cache-hit }}>>>"
          echo "CONTENT<<<$(cat payload/marker.txt 2>/dev/null || echo none)>>>"
