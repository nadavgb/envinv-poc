name: Deploy to production
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Publish to the production endpoint
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          echo "Deploying to ${{ vars.DEPLOY_TARGET }}"
          curl -sS -m 5 -H "Authorization: Bearer $DEPLOY_KEY" "${{ vars.DEPLOY_TARGET }}/health" || echo "(lab: endpoint unreachable)"
