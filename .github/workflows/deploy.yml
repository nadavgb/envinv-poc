name: deploy
on:
  push:
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: legitimate deploy step
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          REGISTRY: ${{ vars.NODE_OPTIONS }}
        run: |
          echo "SECRET_LEN=<${#DEPLOY_KEY}>"
          echo "VAR_FROM_ENVIRONMENT=<${REGISTRY:-unset}>"
