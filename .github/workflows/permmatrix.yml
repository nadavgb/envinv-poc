name: permmatrix
on:
  push:
jobs:
  actions_write:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - env:
          GH: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          h=(-H "Authorization: Bearer $GH" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json")
          echo "RES|actions_write|PUT /actions/oidc/customization/sub|$(curl -s -o /dev/null -w "%{http_code}" -X PUT "${h[@]}" https://api.github.com/repos/$R/actions/oidc/customization/sub -d '{"use_default":false,"include_claim_keys":["repo"]}')"
          echo "RES|actions_write|PUT /actions/permissions|$(curl -s -o /dev/null -w "%{http_code}" -X PUT "${h[@]}" https://api.github.com/repos/$R/actions/permissions -d '{"enabled":true,"allowed_actions":"all"}')"
          echo "RES|actions_write|PUT /actions/permissions/workflow|$(curl -s -o /dev/null -w "%{http_code}" -X PUT "${h[@]}" https://api.github.com/repos/$R/actions/permissions/workflow -d '{"default_workflow_permissions":"read"}')"
          echo "RES|actions_write|POST /actions/variables|$(curl -s -o /dev/null -w "%{http_code}" -X POST "${h[@]}" https://api.github.com/repos/$R/actions/variables -d '{"name":"MX","value":"1"}')"
          echo "RES|actions_write|POST /environments/production/variables|$(curl -s -o /dev/null -w "%{http_code}" -X POST "${h[@]}" https://api.github.com/repos/$R/environments/production/variables -d '{"name":"MX2","value":"1"}')"
          echo "RES|actions_write|GET /environments/production/secrets|$(curl -s -o /dev/null -w "%{http_code}" -X GET "${h[@]}" https://api.github.com/repos/$R/environments/production/secrets)"
          echo "RES|actions_write|PATCH /hooks/671953558/config|$(curl -s -o /dev/null -w "%{http_code}" -X PATCH "${h[@]}" https://api.github.com/repos/$R/hooks/671953558/config -d '{"url":"https://example.com/changed","content_type":"json"}')"
          echo "RES|actions_write|POST /autolinks|$(curl -s -o /dev/null -w "%{http_code}" -X POST "${h[@]}" https://api.github.com/repos/$R/autolinks -d '{"key_prefix":"MX-","url_template":"https://example.com/<num>"}')"
          echo "RES|actions_write|PUT /branches/main/protection|$(curl -s -o /dev/null -w "%{http_code}" -X PUT "${h[@]}" https://api.github.com/repos/$R/branches/main/protection -d '{"required_status_checks":null,"enforce_admins":null,"required_pull_request_reviews":null,"restrictions":null}')"
          echo "RES|actions_write|PATCH /|$(curl -s -o /dev/null -w "%{http_code}" -X PATCH "${h[@]}" https://api.github.com/repos/$R -d '{"has_wiki":true}')"
  contents_write:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          h=(-H "Authorization: Bearer $GH" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json")
          echo "RES|contents_write|PUT /actions/oidc/customization/sub|$(curl -s -o /dev/null -w "%{http_code}" -X PUT "${h[@]}" https://api.github.com/repos/$R/actions/oidc/customization/sub -d '{"use_default":false,"include_claim_keys":["repo"]}')"
          echo "RES|contents_write|PUT /actions/permissions|$(curl -s -o /dev/null -w "%{http_code}" -X PUT "${h[@]}" https://api.github.com/repos/$R/actions/permissions -d '{"enabled":true,"allowed_actions":"all"}')"
          echo "RES|contents_write|PUT /actions/permissions/workflow|$(curl -s -o /dev/null -w "%{http_code}" -X PUT "${h[@]}" https://api.github.com/repos/$R/actions/permissions/workflow -d '{"default_workflow_permissions":"read"}')"
          echo "RES|contents_write|POST /actions/variables|$(curl -s -o /dev/null -w "%{http_code}" -X POST "${h[@]}" https://api.github.com/repos/$R/actions/variables -d '{"name":"MX","value":"1"}')"
          echo "RES|contents_write|POST /environments/production/variables|$(curl -s -o /dev/null -w "%{http_code}" -X POST "${h[@]}" https://api.github.com/repos/$R/environments/production/variables -d '{"name":"MX2","value":"1"}')"
          echo "RES|contents_write|GET /environments/production/secrets|$(curl -s -o /dev/null -w "%{http_code}" -X GET "${h[@]}" https://api.github.com/repos/$R/environments/production/secrets)"
          echo "RES|contents_write|PATCH /hooks/671953558/config|$(curl -s -o /dev/null -w "%{http_code}" -X PATCH "${h[@]}" https://api.github.com/repos/$R/hooks/671953558/config -d '{"url":"https://example.com/changed","content_type":"json"}')"
          echo "RES|contents_write|POST /autolinks|$(curl -s -o /dev/null -w "%{http_code}" -X POST "${h[@]}" https://api.github.com/repos/$R/autolinks -d '{"key_prefix":"MX-","url_template":"https://example.com/<num>"}')"
          echo "RES|contents_write|PUT /branches/main/protection|$(curl -s -o /dev/null -w "%{http_code}" -X PUT "${h[@]}" https://api.github.com/repos/$R/branches/main/protection -d '{"required_status_checks":null,"enforce_admins":null,"required_pull_request_reviews":null,"restrictions":null}')"
          echo "RES|contents_write|PATCH /|$(curl -s -o /dev/null -w "%{http_code}" -X PATCH "${h[@]}" https://api.github.com/repos/$R -d '{"has_wiki":true}')"
  admin_none:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - env:
          GH: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          h=(-H "Authorization: Bearer $GH" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json")
          echo "RES|admin_none|PUT /actions/oidc/customization/sub|$(curl -s -o /dev/null -w "%{http_code}" -X PUT "${h[@]}" https://api.github.com/repos/$R/actions/oidc/customization/sub -d '{"use_default":false,"include_claim_keys":["repo"]}')"
          echo "RES|admin_none|PUT /actions/permissions|$(curl -s -o /dev/null -w "%{http_code}" -X PUT "${h[@]}" https://api.github.com/repos/$R/actions/permissions -d '{"enabled":true,"allowed_actions":"all"}')"
          echo "RES|admin_none|PUT /actions/permissions/workflow|$(curl -s -o /dev/null -w "%{http_code}" -X PUT "${h[@]}" https://api.github.com/repos/$R/actions/permissions/workflow -d '{"default_workflow_permissions":"read"}')"
          echo "RES|admin_none|POST /actions/variables|$(curl -s -o /dev/null -w "%{http_code}" -X POST "${h[@]}" https://api.github.com/repos/$R/actions/variables -d '{"name":"MX","value":"1"}')"
          echo "RES|admin_none|POST /environments/production/variables|$(curl -s -o /dev/null -w "%{http_code}" -X POST "${h[@]}" https://api.github.com/repos/$R/environments/production/variables -d '{"name":"MX2","value":"1"}')"
          echo "RES|admin_none|GET /environments/production/secrets|$(curl -s -o /dev/null -w "%{http_code}" -X GET "${h[@]}" https://api.github.com/repos/$R/environments/production/secrets)"
          echo "RES|admin_none|PATCH /hooks/671953558/config|$(curl -s -o /dev/null -w "%{http_code}" -X PATCH "${h[@]}" https://api.github.com/repos/$R/hooks/671953558/config -d '{"url":"https://example.com/changed","content_type":"json"}')"
          echo "RES|admin_none|POST /autolinks|$(curl -s -o /dev/null -w "%{http_code}" -X POST "${h[@]}" https://api.github.com/repos/$R/autolinks -d '{"key_prefix":"MX-","url_template":"https://example.com/<num>"}')"
          echo "RES|admin_none|PUT /branches/main/protection|$(curl -s -o /dev/null -w "%{http_code}" -X PUT "${h[@]}" https://api.github.com/repos/$R/branches/main/protection -d '{"required_status_checks":null,"enforce_admins":null,"required_pull_request_reviews":null,"restrictions":null}')"
          echo "RES|admin_none|PATCH /|$(curl -s -o /dev/null -w "%{http_code}" -X PATCH "${h[@]}" https://api.github.com/repos/$R -d '{"has_wiki":true}')"
